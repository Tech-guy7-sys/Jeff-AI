name: Build and publish Jeff AI releases

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and publish (for example v0.1.0)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: jeff-ai-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.platform }} / ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: win
            arch: x64
            runner: windows-latest
          - platform: win
            arch: ia32
            runner: windows-latest
          - platform: win
            arch: arm64
            runner: windows-latest
          - platform: mac
            arch: x64
            runner: macos-15-intel
          - platform: mac
            arch: arm64
            runner: macos-14
          - platform: linux
            arch: x64
            runner: ubuntu-latest
          - platform: linux
            arch: arm64
            runner: ubuntu-latest
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies with retry
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if npm install --no-audit --no-fund --fetch-retries=5 --fetch-timeout=120000; then exit 0; fi
            if [ "$attempt" -lt 3 ]; then sleep 15; fi
          done
          exit 1
      - name: Compile TypeScript
        run: npm run build
      - name: Package desktop app
        shell: bash
        env:
          JT_PLATFORM: ${{ matrix.platform }}
          JT_ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          case "$JT_PLATFORM" in
            win) npx electron-builder --win --${JT_ARCH} --config electron-builder.yml --publish never ;;
            mac) npx electron-builder --mac --${JT_ARCH} --config electron-builder.yml --publish never ;;
            linux) npx electron-builder --linux --${JT_ARCH} --config electron-builder.yml --publish never ;;
            *) exit 2 ;;
          esac
          test -d dist
          test "$(find dist -maxdepth 1 -type f | wc -l)" -gt 0
      - name: Upload package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: jeff-ai-${{ matrix.platform }}-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish verified packages
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
      - name: Download all platform packages
        uses: actions/download-artifact@v4
        with:
          pattern: jeff-ai-*
          path: release-assets/packages
          merge-multiple: true
      - name: Package source and generate checksums
        shell: bash
        env:
          VERSION_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p release-assets/source
          zip -r "release-assets/source/Jeff-AI-${VERSION_TAG}-source.zip" . -x ".git/*" "node_modules/*" "dist/*" "release-assets/*"
          find release-assets -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > release-assets/SHA256SUMS.txt
          test -s release-assets/SHA256SUMS.txt
          find release-assets -type f -printf '%p %s bytes\n' | sort
      - name: Create release with installers, source, and checksums
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          name: "Jeff AI ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}"
          generate_release_notes: true
          files: |
            release-assets/packages/*
            release-assets/source/*
            release-assets/SHA256SUMS.txt
          fail_on_unmatched_files: true
